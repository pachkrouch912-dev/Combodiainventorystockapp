<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Multi-Tenant Inventory SaaS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 text-gray-100 min-h-screen flex items-center justify-center font-sans p-4">
    
    <div class="max-w-md w-full bg-slate-900/80 backdrop-blur-md border border-slate-700/60 rounded-2xl p-8 shadow-2xl">
        
        <!-- Header Branding -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 text-2xl mb-3 shadow-inner">
                ⚡
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">SaaS Inventory Hub</h1>
            <p class="text-xs text-slate-400 mt-1">សូមបញ្ចូលគណនីហាងរបស់អ្នកដើម្បីគ្រប់គ្រងស្តុក</p>
        </div>

        <!-- Error Message Alert -->
        {% if error %}
        <div class="bg-red-500/10 border border-red-500/30 text-red-400 text-xs p-3.5 rounded-xl mb-5 text-center flex items-center justify-center space-x-2">
            <span>⚠️</span>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Login Form -->
        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Username</label>
                <input type="text" name="username" required 
                    class="w-full bg-slate-950/60 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm transition" 
                    placeholder="បញ្ចូលឈ្មោះអ្នកប្រើប្រាស់...">
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Password</label>
                </div>
                <input type="password" name="password" required 
                    class="w-full bg-slate-950/60 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm transition" 
                    placeholder="••••••••">
            </div>

            <button type="submit" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-emerald-600/20 transition duration-200 text-sm">
                Login to Store
            </button>
        </form>

        <!-- Footer Note -->
        <div class="text-center mt-6 text-xs text-slate-500">
            Secure Multi-Tenant Cloud Architecture
        </div>
    </div>

</body>
</html>
